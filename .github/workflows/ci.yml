name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  # ---------- Tier 0: only build the heavy images when relevant files change ----------
  changes:
    name: Detect changed paths
    runs-on: ubuntu-latest
    outputs:
      docker: ${{ steps.filter.outputs.docker }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            docker:
              - 'Dockerfile'
              - 'Dockerfile.rag'
              - 'package.json'
              - 'package-lock.json'
              - 'requirements.txt'
              - 'docker-compose.yml'

  # ---------- Tier 1: fast, cheap gates (run in parallel) ----------
  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  hadolint:
    name: Dockerfile lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: hadolint Dockerfile
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: Dockerfile
          failure-threshold: error
      - name: hadolint Dockerfile.rag
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: Dockerfile.rag
          failure-threshold: error

  checkov:
    name: IaC misconfig scan (new MEDIUM+)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Checkov
        run: |
          pip install --quiet checkov
          checkov --file Dockerfile --file Dockerfile.rag --file docker-compose.yml \
            --baseline .checkov.baseline --hard-fail-on MEDIUM --quiet --compact

  build-test:
    name: Node build & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Unit tests
        run: npm run test:unit
      - name: npm audit (high+)
        run: npm audit --audit-level=high

  # ---------- Tier 2: build the RUNNING app image, only if all cheap gates pass ----------
  docker-app:
    name: Docker build (app) + image scan
    needs: [changes, secret-scan, hadolint, checkov, build-test]
    if: needs.changes.outputs.docker == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android /usr/local/.ghcup /opt/hostedtoolcache/CodeQL
          sudo docker image prune -af || true
          df -h /
      - name: Build app image
        run: docker build -f Dockerfile -t paperless-ai:ci .
      - name: Trivy image scan (report-only, HIGH/CRITICAL, fixable)
        run: |
          curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh | sh -s -- -b /usr/local/bin v0.65.0
          trivy image --scanners vuln --severity HIGH,CRITICAL --ignore-unfixed --no-progress --exit-code 0 paperless-ai:ci

  # ---------- Tier 3: heaviest (RAG torch/CUDA image), only if the app image built ----------
  docker-rag:
    name: Docker build (RAG) + image scan
    needs: [docker-app]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android /usr/local/.ghcup /opt/hostedtoolcache/CodeQL
          sudo docker image prune -af || true
          df -h /
      - name: Build RAG image
        run: docker build -f Dockerfile.rag -t paperless-ai-rag:ci .
      - name: Trivy image scan (report-only, HIGH/CRITICAL, fixable)
        run: |
          curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh | sh -s -- -b /usr/local/bin v0.65.0
          trivy image --scanners vuln --severity HIGH,CRITICAL --ignore-unfixed --no-progress --exit-code 0 paperless-ai-rag:ci
