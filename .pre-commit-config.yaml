# Pre-commit hooks for paperless-ai (rivassec maintained fork)
# Activate:  pre-commit install
# Run all:   pre-commit run --all-files
# Bump pins: pre-commit autoupdate
minimum_pre_commit_version: "4.5.0"

repos:
  # Secret scanning (whole repo)
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.0
    hooks:
      - id: gitleaks

  # Shell script linting
  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.11.0.1-1
    hooks:
      - id: shellcheck
        files: \.sh$

  # IaC / container misconfig scanning.
  # Baseline suppresses the legacy Dockerfiles' pre-existing findings;
  # --hard-fail-on MEDIUM fails on NEW medium/high/critical misconfigs.
  - repo: https://github.com/bridgecrewio/checkov
    rev: 3.3.16
    hooks:
      - id: checkov
        files: (Dockerfile.*|docker-compose\.ya?ml)$
        args:
          - --baseline
          - .checkov.baseline
          - --hard-fail-on
          - MEDIUM
          - --quiet
          - --compact

  # Python security linting (RAG service)
  - repo: https://github.com/PyCQA/bandit
    rev: 1.9.4
    hooks:
      - id: bandit
        files: main\.py$

  # Local hooks (system-installed tooling)
  - repo: local
    hooks:
      - id: npm-audit
        name: npm audit (high+)
        entry: npm audit --audit-level=high
        language: system
        files: package-lock\.json$
        pass_filenames: false
      - id: npm-test
        name: npm run test:unit
        entry: npm run test:unit
        language: system
        always_run: true
        pass_filenames: false
